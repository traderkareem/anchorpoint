<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — AnchorPoint</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">A</span>
        <span class="logo-text">AnchorPoint</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="ship.html">Ship</a>
        <a href="track.html">Track</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#about">About</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-ghost">Login</a>
        <a href="signup.html" class="btn btn-accent">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Welcome back</h1>
        <p>Log in to manage your shipments.</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
          <span class="error-msg"></span>
        </div>

        <div class="field">
          <label for="password">Password *</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password" />
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="error-msg"></span>
        </div>

        <button type="submit" class="btn btn-accent btn-lg auth-submit">Log in</button>

        <p class="auth-msg" id="auth-msg"></p>
      </form>

      <p class="auth-foot">
        Don't have an account?
        <a href="signup.html">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>© 2026 AnchorPoint. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
